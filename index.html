<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loka Cosmos Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060c; --ink:#efe7d6; --muted:#a79d8a; --gold:#e3b964;
  --line:rgba(227,185,100,.22); --panel:rgba(10,8,16,.66); --accent:#f4efe2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.55}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(0,0,0,.6))}
#labels{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.l3{position:absolute;left:0;top:0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#f6ead0;white-space:nowrap;text-shadow:0 0 8px #000,0 0 2px #000;opacity:0;transition:opacity .4s}
.l3::after{content:'';display:block;width:1px;height:18px;margin:4px auto 0;background:linear-gradient(#f6ead0,transparent)}
.l3 small{display:block;text-transform:none;letter-spacing:.02em;font-size:11px;color:#cdbf9f;text-align:center}
.progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:30;box-shadow:0 0 8px var(--accent)}
header{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:20;background:linear-gradient(rgba(7,6,12,.85),rgba(7,6,12,0))}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;letter-spacing:.32em;color:var(--gold)}
.wt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:99px}
.hbtn{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;cursor:pointer}
.hbtn[aria-pressed="true"]{background:var(--gold);color:#140f05;border-color:var(--gold)}
.hbtns{display:flex;gap:8px}
main{position:relative;z-index:5}
section.stop{min-height:100vh;display:flex;align-items:center;padding:90px 48px}
.card{max-width:410px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}
.stop.in .card{opacity:1;transform:none}
.kicker{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.card h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:38px;line-height:1.05;margin:0}
.deva{font-family:'Tiro Devanagari Sanskrit',serif;font-size:21px;color:var(--gold);font-weight:400;margin-left:6px;white-space:nowrap}
.iast{font-style:italic;font-family:'Cormorant Garamond',serif;color:var(--muted);font-size:17px;margin-top:2px}
.body p{margin:12px 0 0}
.src{margin:14px 0 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.src::before{content:'Source · ';color:var(--gold)}
.src a{color:inherit;text-decoration:underline;text-decoration-color:rgba(232,196,120,.45);text-underline-offset:2px}
.versions{margin:12px 0 0;font-size:12.5px;color:#d7ccb6;background:rgba(227,185,100,.07);border-left:2px solid var(--gold);padding:8px 10px;border-radius:0 8px 8px 0}
.versions b{color:var(--gold);font-weight:600;margin-right:4px}
.versions summary{cursor:pointer;color:var(--gold);font-weight:600;list-style:none;display:inline;margin-right:4px}
.versions summary::-webkit-details-marker{display:none}
.versions:not([open]) summary::after{content:' · tap to read';color:var(--muted);font-weight:400}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.link{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;transition:.2s}
.link span{color:var(--accent)}
.link:not([disabled]):hover{border-color:var(--accent);background:rgba(255,255,255,.1)}
.link[disabled]{cursor:default;opacity:.55}
.link[disabled]::after{content:' · soon';color:var(--muted)}
/* intro / end */
.intro .card,.end .card{max-width:560px;background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0}
.intro h2,.end h2{font-size:64px;line-height:.98}
.intro .body,.end .body{font-size:16.5px;color:#ddd2bd;max-width:470px}
.hint{margin-top:26px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.hint i{display:block;width:1px;height:34px;background:linear-gradient(var(--gold),transparent);animation:drip 2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cta{background:var(--gold);color:#160f04;border:0;border-radius:99px;padding:11px 20px;font-weight:600;cursor:pointer}
.cta[disabled]{opacity:.75;cursor:default}
.cta{text-decoration:none;display:inline-block}
a.link{text-decoration:none;color:inherit;display:inline-block}
a.st{display:block;text-decoration:none;color:inherit;transition:.2s}
a.st:hover{background:rgba(255,255,255,.1)}
.st-s b{color:var(--accent);font-weight:600}
.cta span{font-weight:400;opacity:.7;margin-left:6px;font-size:12px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:99px;padding:11px 20px;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;min-height:1em}
/* legend + stories */
.legend{margin-top:14px}
.lg-h,.st-head{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 6px rgba(255,255,255,.2)}
#stories{margin-top:14px}
.st{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:7px;background:rgba(255,255,255,.03)}
.st.flag{border-color:var(--accent);background:rgba(255,255,255,.06)}
.st.st-thread{border-style:dashed}
.st-t{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;line-height:1.2}
.st-d{font-size:13px;color:#d6cbb5}
.st-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.badge{font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--accent);color:#120d05;padding:2px 6px;border-radius:99px;vertical-align:3px;font-weight:600}
/* map */
nav.map{position:fixed;right:12px;top:50%;transform:translateY(-62%);z-index:15;display:flex;flex-direction:column;gap:0}
.map button{width:24px;height:20px;background:none;border:0;position:relative;cursor:pointer;padding:0}
.map button::before{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:rgba(239,231,214,.35);transition:.3s}
.map button.on::before{background:var(--accent);width:9px;height:9px;margin:-4.5px;box-shadow:0 0 10px var(--accent)}
.map button span{position:absolute;right:28px;top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.06em;white-space:nowrap;color:var(--ink);opacity:0;transition:.3s;pointer-events:none;text-shadow:0 0 6px #000}
.map button.on span,.map button:hover span,.map button:focus-visible span{opacity:1}
.map .sep{height:1px;width:12px;margin:4px auto;background:var(--line)}
/* dial */
.dial[hidden]{display:none}
.dial{position:fixed;right:16px;bottom:16px;z-index:18;width:470px;background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:box-shadow .4s}
.dial.pulse{box-shadow:0 0 0 1px var(--accent),0 0 30px -4px var(--accent)}
.dial-full{display:flex;gap:6px;padding:12px 14px 12px 8px;align-items:center}
.dial svg{width:150px;height:150px;flex:none;overflow:visible}
.arc{fill:none;stroke:var(--c);stroke-width:12;stroke-linecap:butt;opacity:.3;cursor:pointer;transition:opacity .3s,stroke-width .3s}
.arc:hover{opacity:.6}
.arc.on{opacity:1;stroke-width:15;filter:drop-shadow(0 0 6px var(--c))}
.arc:focus-visible{outline:none;opacity:.8}
.av{fill:rgba(239,231,214,.3);transition:.3s}
.av.on{fill:var(--accent)}
#needle{transform-box:view-box;transform-origin:100px 100px;transition:transform .8s cubic-bezier(.6,.05,.25,1)}
#needle path{fill:var(--accent)}
.ctext{fill:var(--ink);font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;text-anchor:middle}
.csub{fill:var(--muted);font-size:9px;text-anchor:middle;letter-spacing:.06em}
.dial-info{flex:1;min-width:0}
.dial-top{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.iconbtn{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;width:28px;height:28px;cursor:pointer;line-height:1;font-size:15px}
.yname{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.1;margin:2px 0 6px}
.yname .muted{font-family:Inter,sans-serif;font-size:11.5px;font-weight:400;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:4px;flex-wrap:wrap}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:78px}
.legs{display:flex;gap:3px;align-items:flex-end}
.leg{width:5px;height:15px;border-radius:2px;background:rgba(239,231,214,.14);transition:.5s}
.leg.on{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.tiny{font-size:10.5px;color:var(--muted)}
.legnote{margin:3px 0 0;font-size:12px;color:#d6cbb5}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;background:rgba(255,255,255,.04)}
.foot{font-size:10px;color:var(--muted);margin-top:4px}
.thread{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:8px;cursor:pointer}
.thread input{accent-color:var(--gold)}
.threadtext{margin:3px 0 0;font-size:12px;color:var(--accent)}
.dial-mini{display:none;align-items:center;gap:6px;padding:8px 10px}
.mini-name{flex:1;background:none;border:0;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;text-align:left;padding:0 4px}
.mini-name .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.mini-name .tiny{font-family:Inter,sans-serif;font-weight:400;margin-left:auto}
.dial.collapsed{width:330px}
.dial.collapsed .dial-full{display:none}
.dial.collapsed .dial-mini{display:flex}
/* read mode */
body.read #gl,body.read #labels,body.read .vignette,body.read nav.map{display:none}
body.read section.stop{min-height:0;padding:28px 24px;justify-content:center}
body.read section.stop:first-child{padding-top:96px}
body.read section.stop:last-child{padding-bottom:220px}
body.read .card{opacity:1;transform:none;max-width:680px;width:100%;transition:none}
body.read .intro .card,body.read .end .card{padding:0}
body.read .hint{display:none}
@media (prefers-reduced-motion: reduce){.card{transition:opacity .3s}.hint i{animation:none}}
@media (max-width:760px){
  section.stop{align-items:flex-end;padding:76px 16px 92px}
  .card{max-width:none;width:100%;padding:18px 18px 16px}
  .card h2{font-size:32px}
  .intro h2,.end h2{font-size:46px}
  .intro .card,.end .card{background:linear-gradient(transparent,rgba(7,6,12,.7) 30%);padding:12px 0}
  nav.map{display:none}
  .intro .body p:nth-of-type(2){display:none}
  .intro .card{background:linear-gradient(rgba(7,6,12,0),rgba(7,6,12,.85) 25%)}
  .wt{display:none}
  .dial,.dial.collapsed{left:12px;right:12px;bottom:12px;width:auto}
  .dial-full{flex-direction:column;align-items:stretch;max-height:72vh;overflow:auto;padding:12px 14px}
  .dial svg{width:140px;height:140px;margin:0 auto;order:2}
  .dial-info{order:1}
  .legend ul{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div id="labels" aria-hidden="true"></div>
<div class="progress" id="progress"></div>
<header>
  <div class="brand"><span class="logo">LOKA</span><span class="wt">working title · prototype</span></div>
  <div class="hbtns"><button id="readBtn" class="hbtn" aria-pressed="false">Read mode</button></div>
</header>
<nav class="map" id="map" aria-label="Jump to a world"></nav>
<main id="story"></main>

<aside class="dial" id="dial" aria-label="Time dial: the four ages">
  <div class="dial-full">
    <svg id="dialSvg" viewBox="0 0 200 200" role="group" aria-label="Choose an age"></svg>
    <div class="dial-info">
      <div class="dial-top"><span class="eyebrow">Time · the four ages</span><button class="iconbtn" id="dialMin" aria-label="Minimize time dial">–</button></div>
      <div class="yname"><span id="yTitle">Satya yuga</span> <span id="yAlt" class="muted"></span></div>
      <div class="row"><span class="lbl">Dharma</span><span class="legs" id="legs"></span><span class="tiny" id="legsrc"></span></div>
      <p class="legnote" id="legnote"></p>
      <div class="row"><span class="lbl">Vishnu's color</span><span class="sw" id="sw"></span><span id="vname"></span><span class="tiny">Mahabharata 3.148</span></div>
      <div class="chips" id="avatars"></div>
      <div class="foot">¹ varies by list · avatars are placed in their traditional age</div>
      <label class="thread"><input type="checkbox" id="threadToggle"> Follow a soul: Jaya &amp; Vijaya</label>
      <p class="threadtext" id="threadText" hidden></p>
    </div>
  </div>
  <div class="dial-mini">
    <button class="iconbtn" id="yPrev" aria-label="Previous age">‹</button>
    <button class="mini-name" id="dialMax" aria-label="Open time dial"><span class="dot"></span><span id="miniName">Satya yuga</span><span class="tiny" id="miniLegs"></span></button>
    <button class="iconbtn" id="yNext" aria-label="Next age">›</button>
  </div>
</aside>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

const lerp=(a,b,t)=>a+(b-a)*t, glerp=(a,b,t)=>a*Math.pow(b/a,t);

  else { while(i<n-2 && sc>=anchors[i+1]) i++; f=(sc-anchors[i])/Math.max(1,anchors[i+1]-anchors[i]); }
  const e=dwell(f), A=STOPS[i], B=STOPS[i+1], la=A.look||[0,A.y,0], lb=B.look||[0,B.y,0];

}

    const jf=M.hoodFront, heads=[];
    for(let k=-3;k<=3;k++){ const ak=Math.abs(k), outer=new THREE.Group(), inner=new THREE.Group();
      parts.forEach(([g,m])=>inner.add(new THREE.Mesh(g,m)));
      inner.rotation.set(-.12,0,-.174);                       // stand the cut neck upright: the original leans forward and a little to one side
      const gem=new THREE.Mesh(gemGeo,gemMat); gem.position.set(jf[0],jf[1],jf[2]+.25); gem.scale.set(1,1.3,.6); inner.add(gem);
      inner.add(makePoints([jf[0],jf[1],jf[2]+.6],[2.0,.16,.1],2.6,.55));
      outer.add(inner);
      outer.position.set(0,TOP-(3.4+ak*.6)*HS,0).addScaledVector(side,k*.65*HS).addScaledVector(F,(.6-ak*1.1)*HS);
      const rx=ak*.05, rz=-k*.34; outer.rotation.set(rx,camA+k*.09,rz,'YXZ'); outer.scale.setScalar(HS*(1-ak*.06));
      scene.add(outer); heads.push({o:outer,rx,rz,ph:k*1.7});
    }
    sheshaTick=t=>heads.forEach(h=>{ h.o.rotation.z=h.rz+Math.sin(t*.55+h.ph)*.018; h.o.rotation.x=h.rx+Math.sin(t*.4+h.ph*1.3)*.015; });
  }).catch(e=>console.error('shesha model',e));
}

// 3D labels
const labelsEl=document.getElementById('labels');
const LABELS=[
  {pos:new THREE.Vector3(0,12.5,0), t:'Mount Meru', s:'wider at the top · VP 2.2'},
  {pos:new THREE.Vector3(0,.8,-7.6), t:'Bharata', s:'the land of action'},
  {pos:new THREE.Vector3(0,4,-93), t:'Lokaloka', s:'where light ends'},
  {pos:new THREE.Vector3(0,2.5*S+3,0), t:'Dhruva', s:'the pole star'},
  {pos:sun.position, t:'The sun', s:'Bhuvarloka ends here', dyn:true},
];
LABELS.forEach(l=>{ const d=document.createElement('div'); d.className='l3'; d.innerHTML=`${l.t}<small>${l.s}</small>`; labelsEl.appendChild(d); l.el=d; });
const tmp=new THREE.Vector3();
function updateLabels(){
  LABELS.forEach(l=>{
    const p=l.dyn?tmp.copy(l.pos).add(new THREE.Vector3(0,7,0)):tmp.copy(l.pos);
    const near=Math.abs(cur.ly-p.y)<34 && camera.position.distanceTo(p)<230;
    p.project(camera); const vis=near && p.z<1 && Math.abs(p.x)<1.1 && Math.abs(p.y)<1.1;
    l.el.style.opacity=vis?1:0;
    if(vis){ l.el.style.transform=`translate(${((p.x+1)/2*innerWidth).toFixed(1)}px,${((1-p.y)/2*innerHeight).toFixed(1)}px) translate(-50%,-100%)`; }
  });
}

// yuga state
yT={color:new THREE.Color(YUGAS[0].tint),bg:new THREE.Color(YUGAS[0].bg),dharma:1,nebA:new THREE.Color(NEB[0][0]),nebB:new THREE.Color(NEB[0][1])};
const yC={color:yT.color.clone(),bg:yT.bg.clone(),dharma:1,nebA:yT.nebA.clone(),nebB:yT.nebB.clone()};
const cur=camAt(scrollY);

// ---- filmic finish: bloom, ACES colour, vignette, grain, a touch of lens fringing ----
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .7, .55, .95);
if(lowTier) bloom.resolution.set(innerWidth/2,innerHeight/2);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finish=new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, time:{value:0}, grain:{value:lowTier?.035:.045}, vig:{value:.55}, ca:{value:lowTier?0:.006},
             flash:{value:0}, flashCol:{value:new THREE.Color('#ffe2a8')}, res:{value:new THREE.Vector2(innerWidth,innerHeight)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float time,grain,vig,ca,flash; uniform vec3 flashCol; uniform vec2 res; varying vec2 vUv;
  float rnd(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
  void main(){
    vec2 cc=vUv-0.5; float r2=dot(cc,cc); vec2 off=cc*ca*(0.4+r2*2.0);
    vec3 c=vec3(texture2D(tDiffuse,vUv+off).r, texture2D(tDiffuse,vUv).g, texture2D(tDiffuse,vUv-off).b);
    c*=1.0-vig*smoothstep(0.12,0.62,r2*1.5);
    c+=flashCol*flash;
    c+=(rnd(vUv*res+fract(time*7.0)*91.0)-0.5)*grain;
    gl_FragColor=vec4(c,1.0);
  }` });
composer.addPass(finish);

function resize(){ renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); finish.uniforms.res.value.set(innerWidth,innerHeight); starU.pr.value=renderer.getPixelRatio();
  if(lowTier) bloom.resolution.set(innerWidth/2,innerHeight/2);
  camera.aspect=innerWidth/innerHeight;
  // keep the cosmos to the right of the reading card on wide screens
  if(innerWidth>760) camera.setViewOffset(innerWidth,innerHeight,-innerWidth*.15,0,innerWidth,innerHeight); else camera.setViewOffset(innerWidth,innerHeight,0,innerHeight*.18,innerWidth,innerHeight);
  camera.updateProjectionMatrix(); measure(); }
addEventListener('resize',resize); resize();

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(document.body.classList.contains('read')) return;
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  const tg=camAt(scrollY); const k=reduce?1:1-Math.exp(-dt*3.2);
  for(const key in tg) cur[key]+=(tg[key]-cur[key])*k;
  const drift=reduce?0:Math.sin(t*.07)*.12;
  const a=cur.ang+drift, d=cur.dist*(camera.aspect<.8?1.35:1);
  camera.position.set(Math.sin(a)*d,cur.y+cur.h,Math.cos(a)*d);
  camera.lookAt(cur.lx,cur.ly,cur.lz);
  scene.fog.density=cur.fog*(camera.aspect<.8?.8:1);

  const k2=1-Math.exp(-dt*2.2);
  yC.color.lerp(yT.color,k2); yC.bg.lerp(yT.bg,k2); yC.dharma+=(yT.dharma-yC.dharma)*k2;
  yC.nebA.lerp(yT.nebA,k2); yC.nebB.lerp(yT.nebB,k2);
  scene.fog.color.copy(yC.bg).multiplyScalar(.5);
  sky.position.copy(camera.position); starsGroup.position.copy(camera.position); starU.time.value=reduce?0:t;
  skyMat.uniforms.time.value=t; skyMat.uniforms.nebA.value.copy(yC.nebA); skyMat.uniforms.nebB.value.copy(yC.nebB);
  skyMat.uniforms.intensity.value=.7+.35*yC.dharma; skyMat.uniforms.neb.value=.012+.03*(1-yC.dharma);
  skyMat.uniforms.tint.value.setRGB(1,1,1).lerp(yC.color,.12);
  // the egg glows as you pass through its shell
  { const p=camera.position, e=Math.sqrt((p.x/EGG.a)**2+((p.y-EGG.cy)/EGG.b)**2+(p.z/EGG.a)**2);
    const nearK=Math.exp(-Math.abs(e-1)*45); eggMat.uniforms.near.value=nearK; eggMat.uniforms.inside.value=e<1?1:0;
    eggMat.uniforms.time.value=t; eggMat.uniforms.col.value.copy(yC.color).lerp(new THREE.Color('#ffd58a'),.6);
    finish.uniforms.flash.value=reduce?0:nearK*.18; }
  finish.uniforms.time.value=t;
  axisMat.color.copy(yC.color); dharmaPts.material.color.copy(yC.color);
  dhruvaFade.value=THREE.MathUtils.smoothstep(camera.position.distanceTo(dhruva.position),14,32);
  { const m=dharmaPts.material, tgt=Math.abs(cur.ly)<12?.03:.4; m.opacity+=(tgt-m.opacity)*Math.min(1,dt*3); }   // the rising motes would haze the view of the earth
  dGeo.setDrawRange(0,Math.round(DN*(.12+.88*yC.dharma)));
  meruMat.emissive.setRGB(.23,.15,.03); meruCap.material.color.copy(yC.color);
  dust.material.opacity=.15+.15*yC.dharma; ambient.intensity=.3+.35*yC.dharma;
  const sf=.5+.5*yC.dharma;
  bharataGlow.material.opacity=.1+.08*Math.sin(t*1.4);
  bhuU.sunPos.value.copy(sun.position);

  if(!reduce){
    spinners.forEach(([g,s])=>g.rotation.y+=dt*.02*s);
    lotus.rotation.y+=dt*.05; bhu.rotation.y=0;
    const sa=t*.08; sun.position.set(Math.cos(sa)*26,1.5*S,Math.sin(sa)*26);
    for(let i=0;i<DN;i++){ let y=dpos[i*3+1]+dspd[i]*dt; if(y>270) y=-312; dpos[i*3+1]=y; }
    dGeo.attributes.position.needsUpdate=true;
    if(sheshaTick) sheshaTick(t);
  }
  sunLight.position.copy(sun.position);
  DU.time.value=reduce?0:t; DU.dharma.value=yC.dharma;
  billboards.forEach(b=>b.quaternion.copy(camera.quaternion));
  { const sy=sun.position.y, between=(sy-cur.ly)*(sy-camera.position.y)<0 && Math.abs(sy-cur.ly)>8; const f=sunBB.material.uniforms.fade; f.value+=((between?.08:1)-f.value)*Math.min(1,dt*3); }
  { const far=camera.position.length()>300; discs.forEach(g=>{ g.visible=far||Math.abs(g.position.y-camera.position.y)<170;
      // a world that sits between the camera and the world we're looking at turns faint, so it doesn't fog the view
      const dy=g.position.y-cur.ly, between=!far && dy*(g.position.y-camera.position.y)<0 && Math.abs(dy)>8;
      // and one the camera is passing through, near its centre (on the way to and from the sky stop)
      const inside=Math.abs(g.position.y-camera.position.y)<9 && Math.hypot(camera.position.x,camera.position.z)<55;
      g.userData.fade+=((between||inside?0:1)-g.userData.fade)*Math.min(1,dt*3); g.userData.mats.forEach(m=>m.uniforms.fade.value=g.userData.fade); }); }
  composer.render();
  updateLabels();
}
requestAnimationFrame(frame);
}

setYuga(0);
// deep links from sagas: ?yuga=1&thread=1#s-bharata
{ const q=new URLSearchParams(location.search);
  if(q.has('yuga')) setYuga(+q.get('yuga')||0);
  if(q.get('thread')==='1'){ threadToggle.checked=true; onThread(); }
  if(location.hash){ const el=document.querySelector(location.hash); if(el) setTimeout(()=>{ measure(); window.scrollTo(0,el.offsetTop+el.offsetHeight/2-innerHeight/2); },60); } }
</script>
